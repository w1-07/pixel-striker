function resize(){
  const vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  const scale=Math.min(vw/W,vh/H);

  canvas.style.width=Math.floor(W*scale)+'px';
  canvas.style.height=Math.floor(H*scale)+'px';
}

// ===== AUDIO (simple beep using oscillator) =====
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function beep(freq,dur,type='square',vol=0.08){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfx(s){
  if(s==='shoot')beep(880,0.08);
  else if(s==='explosion')beep(120,0.2,'sawtooth',0.12);
  else if(s==='pickup'){beep(440,0.05);setTimeout(()=>beep(660,0.05),50);setTimeout(()=>beep(880,0.08),100)}
  else if(s==='boss'){beep(200,0.15,'sawtooth',0.1);setTimeout(()=>beep(200,0.15,'sawtooth',0.1),150);setTimeout(()=>beep(200,0.15,'sawtooth',0.1),300)}
  else if(s==='gameover'){beep(660,0.15);setTimeout(()=>beep(440,0.15),150);setTimeout(()=>beep(220,0.3),300)}
}

// Cache images
const IMG={};
function cacheImg(key,fn){if(!IMG[key])IMG[key]=fn();return IMG[key]}

// ===== SPAWNER =====
function startLevel(){
  const total=10+level*3;
  const speedMult=1.0+level*0.12;
  const pool=[0]; // scout
  if(level>=2)pool.push(1); // zigzag
  if(level>=3)pool.push(4); // sniper
  if(level>=4)pool.push(3); // tank
  if(level>=5)pool.push(2); // kamikaze

  spawner.queue=[];
  for(let i=0;i<total;i++){
    const type=pool[Math.floor(Math.random()*pool.length)];
    const e=createEnemy(type,speedMult);
    e.x=Math.random()*(W-24)+6;
    e.y=-Math.random()*60-12;
    e.initX=e.x;
    spawner.queue.push(e);
  }
  spawner.timer=0;
  spawner.interval=Math.max(15,40-level);
  spawner.active=true;
}

function createEnemy(type,sm){
  const e={type,hp:1,score:100,speedMult:sm,timer:Math.floor(Math.random()*60),
    shootTimer:0,initX:0,amplitude:30+Math.random()*30,freq:0.03+Math.random()*0.03,
    targetX:null,moveDir:Math.random()<0.5?-1:1,x:0,y:-30,w:12,h:12};
  if(type===2){e.hp=2;e.score=200;e.w=10;e.h=12}
  else if(type===3){e.hp=3;e.score=300;e.w=16;e.h=14;e.shootCd=Math.floor(60/sm)}
  else if(type===4){e.hp=2;e.score=250;e.w=14;e.h=12;e.shootCd=Math.floor(90)}
  else if(type===1){e.score=150;e.w=14;e.h=10}
  else{e.w=12;e.h=12}
  return e;
}

// ===== BOSS =====
function createBoss(){
  const tier=Math.floor(level/5);
  const btype=(tier-1)%3; // 0=机甲 1=蜘蛛 2= UFO, cycle every 3 bosses
  const hp=40+15*Math.max(0,tier-1);
  return {
    x:W/2-20,y:-40,w:40,h:40,targetY:60,entered:false,
    maxHp:hp,hp:hp,btype,
    alive:true,moveDir:1,moveTimer:0,attackTimer:0,
    attackCd:55,phase:1,angleOff:0,spiralAngle:0
  };
}

// ===== PARTICLES =====
function spawnExplosion(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20+Math.random()*15,
      maxLife:35,color,size:2});
  }
}

// ===== GAME LOGIC =====
function resetGame(){
  player.x=W/2;player.y=H-60;player.lives=3;player.weapon=1;
  player.shootCd=0;player.invT=0;player.shieldT=0;
  godMode=false;secretTaps=0;secretTimer=0;
  skinSecretTaps=0;skinSecretTimer=0;
  // Don't reset muleSkin - keeps skin across restarts
  pBullets=[];eBullets=[];enemies=[];powerups=[];particles=[];
  boss=null;bossSpawned=false;score=0;level=1;
  startLevel();
}

function playerShoot(){
  if(player.shootCd>0)return;
  player.shootCd=8;
  const cx=player.x, ty=player.y;
  const bullets=[];
  if(player.weapon===1)bullets.push({x:cx,y:ty,speed:-8});
  else if(player.weapon===2){bullets.push({x:cx-4,y:ty+4,speed:-8});bullets.push({x:cx+4,y:ty+4,speed:-8})}
  else if(player.weapon===3){bullets.push({x:cx,y:ty,speed:-8});bullets.push({x:cx-5,y:ty+4,speed:-8});bullets.push({x:cx+5,y:ty+4,speed:-8})}
  else{bullets.push({x:cx,y:ty,speed:-8});bullets.push({x:cx-6,y:ty+2,speed:-8});bullets.push({x:cx+6,y:ty+2,speed:-8});bullets.push({x:cx-3,y:ty+4,speed:-8});bullets.push({x:cx+3,y:ty+4,speed:-8})}
  bullets.forEach(b=>pBullets.push(b));
  sfx('shoot');
}

function enemyShoot(e){
  if(e.type===3){ // Tank - shoot down
    e.shootTimer++;
    if(e.shootTimer>=e.shootCd){e.shootTimer=0;eBullets.push({x:e.x+e.w/2,y:e.y+e.h,speedX:0,speedY:2.2,isBoss:false})}
  }else if(e.type===4){ // Sniper - aim at player
    e.shootTimer++;
    if(e.shootTimer>=e.shootCd){e.shootTimer=0;
      const dx=player.x-e.x-e.w/2,dy=player.y-e.y-e.h/2;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      eBullets.push({x:e.x+e.w/2,y:e.y+e.h,speedX:dx/dist*2.5,speedY:dy/dist*2.5,isBoss:false})}
  }
}

function bossShoot(){
  if(!boss||!boss.alive||!boss.entered)return;
  boss.attackTimer++;
  if(boss.attackTimer<boss.attackCd)return;
  boss.attackTimer=0;
  boss.angleOff+=0.12;
  const cx=boss.x+boss.w/2,cy=boss.y+boss.h-5;
  const sp=2.0;

  if(boss.btype===0){
    // Type 0: 机甲 — fan spread + aimed at low HP
    if(boss.phase<=2){
      for(let i=0;i<10;i++){
        const a=i/10*Math.PI*2+boss.angleOff;
        eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp,speedY:Math.sin(a)*sp,isBoss:true});
      }
    }
    if(boss.phase>=2){
      const dx=player.x-cx,dy=player.y-cy,dist=Math.sqrt(dx*dx+dy*dy)||1;
      for(let s=-0.2;s<=0.2;s+=0.2){
        const a=Math.atan2(dy,dx)+s;
        eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp*1.2,speedY:Math.sin(a)*sp*1.2,isBoss:true});
      }
    }
    if(boss.phase===3){
      for(let o=-30;o<=30;o+=20){
        eBullets.push({x:boss.x+boss.w/2+o,y:boss.y+boss.h,speedX:0,speedY:3.5,isBoss:false});
      }
    }
  }else if(boss.btype===1){
    // Type 1: 蜘蛛 — spiral bullets
    boss.spiralAngle=(boss.spiralAngle||0)+0.4;
    for(let i=0;i<3;i++){
      const a=boss.spiralAngle+i*Math.PI*2/3;
      eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp*1.3,speedY:Math.sin(a)*sp*1.3,isBoss:true});
    }
    if(boss.phase>=2){
      // extra random spray
      for(let i=0;i<5;i++){
        const a=Math.random()*Math.PI*2;
        eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp,speedY:Math.abs(Math.sin(a))*sp,isBoss:false});
      }
    }
    if(boss.phase===3){
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2+boss.angleOff;
        eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp*0.8,speedY:Math.sin(a)*sp*0.8,isBoss:true});
      }
    }
  }else{
    // Type 2: UFO — fast aimed bursts
    const dx=player.x-cx,dy=player.y-cy,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const baseA=Math.atan2(dy,dx);
    for(let s=-0.25;s<=0.25;s+=0.25){
      const a=baseA+s;
      eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp*1.5,speedY:Math.sin(a)*sp*1.5,isBoss:true});
    }
    if(boss.phase>=2){
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2+boss.angleOff;
        eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp,speedY:Math.sin(a)*sp,isBoss:true});
      }
    }
    if(boss.phase===3){
      for(let i=0;i<12;i++){
        const a=i/12*Math.PI*2+boss.angleOff*2;
        eBullets.push({x:cx,y:cy,speedX:Math.cos(a)*sp*1.1,speedY:Math.sin(a)*sp*1.1,isBoss:true});
      }
    }
  }
}

function colCheck(a,b,r1,r2){
  const acx=a.w!=null?a.x+a.w/2:a.x;
  const acy=a.h!=null?a.y+a.h/2:a.y;
  const bcx=b.w!=null?b.x+b.w/2:b.x;
  const bcy=b.h!=null?b.y+b.h/2:b.y;
  return (acx-bcx)*(acx-bcx)+(acy-bcy)*(acy-bcy)<(r1+r2)*(r1+r2);
}

function update(){
  if(state===STATE.PLAYING){
    // Player movement
    let mx=0,my=0;
    if(touchActive&&touchX!==null){
      const dx=touchX-player.x,dy=touchY-player.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      if(dist>2){mx=dx/dist*Math.min(dist*0.2,player.speed);my=dy/dist*Math.min(dist*0.2,player.speed)}
    }
    if(keys['ArrowLeft']||keys['KeyA'])mx=-player.speed;
    if(keys['ArrowRight']||keys['KeyD'])mx=player.speed;
    if(keys['ArrowUp']||keys['KeyW'])my=-player.speed;
    if(keys['ArrowDown']||keys['KeyS'])my=player.speed;
    player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x+mx));
    player.y=Math.max(player.h/2,Math.min(H-player.h/2,player.y+my));

    // Cooldowns
    if(player.shootCd>0)player.shootCd--;
    if(player.invT>0)player.invT--;
    if(player.shieldT>0)player.shieldT--;
    // Secret tap timer
    if(secretTimer>0){secretTimer--;if(secretTimer<=0)secretTaps=0;}
    if(skinSecretTimer>0){skinSecretTimer--;if(skinSecretTimer<=0)skinSecretTaps=0;}

    // Auto-shoot on mobile or space held
    if(touchActive||keys['Space'])playerShoot();

    // Spawner
    if(spawner.active&&spawner.queue.length>0){
      spawner.timer++;
      if(spawner.timer>=spawner.interval){
        spawner.timer=0;
        const e=spawner.queue.shift();
        if(e.type===2)e.targetX=player.x;
        enemies.push(e);
      }
    }
    if(spawner.active&&spawner.queue.length===0)spawner.active=false;

    // Update enemies
    enemies.forEach(e=>{
      e.timer++;
      if(e.type===0)e.y+=1.3*e.speedMult;
      else if(e.type===1){e.y+=1.3*e.speedMult*0.9;e.x=e.initX+Math.sin(e.timer*e.freq)*e.amplitude}
      else if(e.type===2){e.y+=1.3*e.speedMult*1.5;if(e.targetX!==null){const d=e.targetX-e.x-e.w/2;if(Math.abs(d)>2)e.x+=Math.sign(d)*2}}
      else if(e.type===3)e.y+=1.3*e.speedMult*0.5;
      else if(e.type===4){e.x+=e.moveDir*1.2*e.speedMult;if(e.y<100)e.y+=0.4;if(e.x<=0)e.moveDir=1;if(e.x>=W-e.w)e.moveDir=-1}
      enemyShoot(e);
    });
    enemies=enemies.filter(e=>e.y<H+30&&e.y>-100);

    // Update bullets
    pBullets.forEach(b=>b.y+=b.speed);
    pBullets=pBullets.filter(b=>b.y>-10);
    eBullets.forEach(b=>{b.x+=b.speedX||0;b.y+=b.speedY||0});
    eBullets=eBullets.filter(b=>b.y<H+10&&b.y>-10&&b.x>-10&&b.x<W+10);

    // Update powerups
    powerups.forEach(p=>p.y+=2);
    powerups=powerups.filter(p=>p.y<H+20);

    // Boss
    if(boss&&boss.alive){
      if(!boss.entered){boss.y+=2;if(boss.y>=boss.targetY){boss.y=boss.targetY;boss.entered=true}}
      else{
        boss.moveTimer++;
        boss.x+=boss.moveDir*1.5;
        if(boss.x<=0){boss.x=0;boss.moveDir=1}
        if(boss.x>=W-boss.w){boss.x=W-boss.w;boss.moveDir=-1}
        if(Math.random()<0.01)boss.moveDir*=-1;

        const ratio=boss.hp/boss.maxHp;
        if(ratio>0.66){boss.phase=1;boss.attackCd=45}
        else if(ratio>0.33){boss.phase=2;boss.attackCd=32}
        else{boss.phase=3;boss.attackCd=20}
      }
      bossShoot();
    }

    // Collision: player bullets vs enemies
    for(let i=pBullets.length-1;i>=0;i--){
      const b=pBullets[i];
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(colCheck(b,e,2,Math.min(e.w,e.h)/2)){
          pBullets.splice(i,1);
          e.hp--;
          if(e.hp<=0){
            score+=e.score;
            spawnExplosion(e.x+e.w/2,e.y+e.h/2,'#f44',10);
            sfx('explosion');
            if(Math.random()<0.25){
              const types=['weapon','life','shield','star'];
              const wts=[40,15,20,25];
              const r=Math.random()*100;let t=0,acc=wts[0];
              while(r>acc&&t<3){t++;acc+=wts[t]}
              powerups.push({x:e.x+e.w/2,y:e.y+e.h/2,type:types[t]});
            }
            enemies.splice(j,1);
          }
          hit=true;break;
        }
      }
      if(hit)continue;

      // vs Boss
      if(boss&&boss.alive&&boss.entered&&colCheck(b,boss,2,20)){
        pBullets.splice(i,1);
        boss.hp--;
        if(boss.hp<=0){boss.alive=false;score+=5000;spawnExplosion(boss.x+boss.w/2,boss.y+boss.h/2,'#f80',35);sfx('explosion');eBullets=[]}
      }
    }

    // Collision: enemy bullets vs player
    if(player.invT<=0&&player.shieldT<=0){
      for(let i=eBullets.length-1;i>=0;i--){
        const b=eBullets[i];
        if(colCheck(b,player,4,player.hitR)){
          eBullets.splice(i,1);
          playerHit();
          break;
        }
      }
      // Enemy body vs player
      for(const e of enemies){
        if(colCheck(e,player,Math.min(e.w,e.h)/2,player.hitR)){
          playerHit();
          e.hp-=10;if(e.hp<=0){spawnExplosion(e.x+e.w/2,e.y+e.h/2,'#f44',10);enemies.splice(enemies.indexOf(e),1)}
          break;
        }
      }
      // Boss body vs player
      if(boss&&boss.alive&&colCheck(boss,player,20,player.hitR)){
        playerHit();
      }
    }

    // Powerup pickup
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i];
      if(Math.abs(player.x-p.x)<12&&Math.abs(player.y-p.y)<12){
        if(p.type==='weapon'){player.weapon=Math.min(4,player.weapon+1);score+=100}
        else if(p.type==='life'){player.lives=Math.min(5,player.lives+1);score+=200}
        else if(p.type==='shield'){player.shieldT=300;score+=150}
        else{score+=500}
        spawnExplosion(p.x,p.y,'#ff0',8);
        sfx('pickup');
        powerups.splice(i,1);
      }
    }

    // Check level complete
    const isBoss=level%5===0;
    if(!isBoss&&!spawner.active&&enemies.length===0&&pBullets.length===0){
      level++;score+=1000;
      state=STATE.LEVEL_TRANS;levelTimer=100;levelBoss=level%5===0;
      startLevel();
    }

    // Spawn boss
    if(isBoss&&!bossSpawned&&!spawner.active&&enemies.length===0){
      boss=createBoss();bossSpawned=true;sfx('boss');
    }

  }else if(state===STATE.LEVEL_TRANS){
    levelTimer--;
    if(levelTimer<=0)state=STATE.PLAYING;
  }

  // Update particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});
  particles=particles.filter(p=>p.life>0);
}

function playerHit(){
  if(godMode||player.invT>0||player.shieldT>0)return;
  player.lives--;
  player.weapon=Math.max(1,player.weapon-1);
  player.invT=120;
  if(player.lives<=0){spawnExplosion(player.x,player.y,'#0ff',25);sfx('gameover');state=STATE.GAME_OVER}
  else sfx('explosion');
}

// ===== RENDER =====
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  if(state===STATE.MENU)drawMenu();
  else{
    drawScene();
    if(state===STATE.LEVEL_TRANS)drawLevelTrans();
    else if(state===STATE.PLAYING)drawHUD();
    else if(state===STATE.PAUSED)drawPause();
    else if(state===STATE.GAME_OVER)drawGameOver();
  }
}

function drawScene(){
  // Powerups
  powerups.forEach(p=>{
    ctx.fillStyle=p.type==='weapon'?'#f00':p.type==='life'?'#f6c':p.type==='shield'?'#4af':'#ff0';
    ctx.fillRect(p.x-5,p.y-5,10,10);
  });
  // Bullets
  ctx.fillStyle='#0ff';
  pBullets.forEach(b=>ctx.fillRect(b.x-1,b.y-4,2,8));
  eBullets.forEach(b=>{
    ctx.fillStyle=b.isBoss?'#f0f':'#f44';
    ctx.fillRect(b.x-2,b.y-2,4,4);
  });
  // Enemies
  enemies.forEach(e=>{
    let img;
    if(e.type===0)img=cacheImg('scout',drawEnemyScout);
    else if(e.type===1)img=cacheImg('zigzag',drawEnemyZigzag);
    else if(e.type===2)img=cacheImg('kaze',drawEnemyKamikaze);
    else if(e.type===3)img=cacheImg('tank',drawEnemyTank);
    else img=cacheImg('sniper',drawEnemySniper);
    ctx.drawImage(img,e.x,e.y);
  });
  // Boss
  if(boss&&boss.alive){
    if(boss.btype===0){ // 机甲
      ctx.fillStyle='#600';ctx.fillRect(boss.x,boss.y,boss.w,boss.h);
      ctx.fillStyle='#f00';ctx.fillRect(boss.x+6,boss.y+2,boss.w-12,6);
      ctx.fillStyle='#fff';ctx.fillRect(boss.x+10,boss.y+3,3,3);ctx.fillRect(boss.x+16,boss.y+3,3,3);
      ctx.fillStyle='#f80';ctx.fillRect(boss.x+2,boss.y+boss.h-4,6,4);ctx.fillRect(boss.x+boss.w-8,boss.y+boss.h-4,6,4);
    }else if(boss.btype===1){ // 蜘蛛
      ctx.fillStyle='#040';ctx.fillRect(boss.x,boss.y,boss.w,boss.h);
      ctx.fillStyle='#0a0';ctx.fillRect(boss.x+4,boss.y+4,boss.w-8,boss.h-8);
      // 八眼
      for(let ex=8;ex<=28;ex+=10){
        for(let ey=8;ey<=16;ey+=8){
          ctx.fillStyle='#f00';ctx.fillRect(boss.x+ex,boss.y+ey,3,3);
        }
      }
      // 腿
      ctx.fillStyle='#0a0';
      ctx.fillRect(boss.x-4,boss.y+12,6,2);ctx.fillRect(boss.x+boss.w-2,boss.y+12,6,2);
      ctx.fillRect(boss.x-4,boss.y+24,6,2);ctx.fillRect(boss.x+boss.w-2,boss.y+24,6,2);
    }else{ // UFO
      ctx.fillStyle='#224';ctx.fillRect(boss.x,boss.y+8,boss.w,boss.h-8);
      // 圆顶
      ctx.fillStyle='#48f';ctx.beginPath();
      ctx.ellipse(boss.x+boss.w/2,boss.y+8,boss.w/2,14,0,Math.PI,0);
      ctx.fill();
      // 灯光
      for(let lx=8;lx<=28;lx+=10){
        ctx.fillStyle=frame%20<10?'#ff0':'#f80';
        ctx.fillRect(boss.x+lx,boss.y+boss.h-6,5,3);
      }
    }
  }
  // Player
  if(player.invT<=0||Math.floor(player.invT/4)%2!==0){
    const img=muleSkin?cacheImg('mule',drawMule):cacheImg('player',drawPlayer);
    ctx.drawImage(img,player.x-player.w/2,player.y-player.h/2);
  }
  // Shield
  if(player.shieldT>0||godMode){
    ctx.strokeStyle=godMode?'#ff0':'#0ff';ctx.lineWidth=2;ctx.beginPath();
    ctx.arc(player.x,player.y,12,0,Math.PI*2);ctx.stroke();
    if(godMode&&frame%10<5){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(player.x,player.y,14,0,Math.PI*2);ctx.stroke()}
  }
  // Particles
  particles.forEach(p=>{
    ctx.fillStyle=`rgba(${parseInt(p.color.slice(1,3),16)},${parseInt(p.color.slice(3,5),16)},${parseInt(p.color.slice(5,7),16)},${p.life/p.maxLife})`;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
}

function drawHUD(){
  ctx.fillStyle='#fff';ctx.font='bold 10px monospace';
  ctx.fillText('SCORE:'+String(score).padStart(8,'0'),4,10);
  ctx.fillText('WPN:Lv'+player.weapon,4,H-4);
  // Lives
  for(let i=0;i<player.lives;i++){ctx.fillStyle='#f6c';ctx.fillRect(W-20-i*16,4,6,6)}
  if(player.shieldT>0){ctx.fillStyle='#4af';ctx.fillText('SHIELD:'+Math.ceil(player.shieldT/60)+'s',W-80,H-4)}
  // God mode indicator
  if(godMode){ctx.fillStyle='#ff0';ctx.font='bold 12px monospace';ctx.fillText('INVINCIBLE',W/2-35,H-4)}
  // Secret tap progress
  if(secretTaps>0){ctx.fillStyle='#f80';ctx.font='8px monospace';ctx.fillText('*'.repeat(secretTaps),W-100,18)}
  // Boss HP
  if(boss&&boss.alive&&boss.entered){
    const bw=200,bh=8,bx=(W-bw)/2,by=25;
    ctx.fillStyle='#444';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    const ratio=boss.hp/boss.maxHp;
    ctx.fillStyle=ratio>0.5?'#0f0':ratio>0.25?'#ff0':'#f00';
    ctx.fillRect(bx,by,bw*ratio,bh);
    const bossNames=['机甲守卫','蜘蛛女王','UFO母舰'];
    ctx.fillStyle='#fff';ctx.fillText(bossNames[boss.btype]||'BOSS',W/2-ctx.measureText(bossNames[boss.btype]||'BOSS').width/2,by-3);
  }
}

function drawMenu(){
  ctx.fillStyle='#0ff';ctx.font='bold 22px monospace';
  const titleTxt='骡子开飞机';
  ctx.fillText(titleTxt,W/2-ctx.measureText(titleTxt).width/2,140);
  ctx.font='10px monospace';
  if(Math.floor(frame/40)%2===0){
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';
    const txt=navigator.maxTouchPoints>0?'TAP TO START':'CLICK OR PRESS SPACE';
    ctx.fillText(txt,W/2-ctx.measureText(txt).width/2,240);
  }
  ctx.fillStyle='#888';ctx.font='9px monospace';
  const lines=['WASD/ARROWS - MOVE','SPACE - SHOOT','P/ESC - PAUSE'];
  lines.forEach((l,i)=>ctx.fillText(l,30,290+i*18));
  ctx.fillStyle='#f80';const t2='* Click window if controls dont work *';ctx.fillText(t2,W/2-ctx.measureText(t2).width/2,330);
}

function drawLevelTrans(){
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 20px monospace';
  if(levelBoss){ctx.fillStyle='#f00';
    const bnames=['机甲守卫','蜘蛛女王','UFO母舰'];
    const bn=bnames[(Math.floor(level/5)-1)%3];
    ctx.fillText('BOSS: '+bn,W/2-ctx.measureText('BOSS: '+bn).width/2,H/2-10)}
  else{ctx.fillStyle='#0ff';ctx.fillText('LEVEL '+level,W/2-ctx.measureText('LEVEL '+level).width/2,H/2-10)}
}

function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.fillText('PAUSED',W/2-36,H/2-5);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f00';ctx.font='bold 20px monospace';ctx.fillText('GAME OVER',W/2-60,180);
  ctx.fillStyle='#ff0';ctx.font='bold 14px monospace';
  ctx.fillText('SCORE:'+String(score).padStart(8,'0'),W/2-45,220);
  if(Math.floor(frame/40)%2===0){
    ctx.fillStyle='#fff';ctx.font='11px monospace';
    ctx.fillText('PRESS SPACE TO RETRY',W/2-72,280);
  }
}

// ===== INPUT =====
canvas.addEventListener('touchstart',handleTouch,{passive:false});
canvas.addEventListener('touchmove',handleTouch,{passive:false});
canvas.addEventListener('touchend',e=>{touchActive=false;touchX=null;touchY=null});
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  initAudio();
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight')e.preventDefault();
  if(state===STATE.MENU&&e.code==='Space')startPlay();
  if(state===STATE.PLAYING&&(e.code==='KeyP'||e.code==='Escape'))state=STATE.PAUSED;
  else if(state===STATE.PAUSED&&(e.code==='KeyP'||e.code==='Escape'))state=STATE.PLAYING;
  if(state===STATE.GAME_OVER&&e.code==='Space'){resetGame();state=STATE.LEVEL_TRANS;levelTimer=80;levelBoss=false}
});
document.addEventListener('keyup',e=>{keys[e.code]=false});

function handleTouch(e){
  e.preventDefault();initAudio();
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const tx=(e.touches[0].clientX-rect.left)*scaleX;
  const ty=(e.touches[0].clientY-rect.top)*scaleY;

  // Secret: tap lives area (top-right) 3 times for god mode
  if(state===STATE.PLAYING&&tx>W-100&&ty<20){
    secretCheck();
    return;
  }
  // Secret: tap score area (top-left) 3 times for mule skin
  if(state===STATE.PLAYING&&tx<80&&ty<20){
    skinSecretCheck();
    return;
  }

  if(state===STATE.MENU){startPlay();return}
  if(state===STATE.GAME_OVER){resetGame();state=STATE.LEVEL_TRANS;levelTimer=80;levelBoss=false;return}
  touchX=tx;touchY=ty;touchActive=true;
}

function secretCheck(){
  secretTaps++;secretTimer=90;
  if(secretTaps>=3){godMode=true;secretTaps=0;sfx('pickup');sfx('pickup');sfx('pickup')}
  else sfx('shoot');
}

function skinSecretCheck(){
  skinSecretTaps++;skinSecretTimer=90;
  if(skinSecretTaps>=3){muleSkin=!muleSkin;skinSecretTaps=0;sfx('pickup');sfx('pickup');sfx('pickup')}
  else sfx('shoot');
}

// Desktop click on lives area
canvas.addEventListener('click',e=>{
  initAudio();
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const cx=(e.clientX-rect.left)*scaleX;
  const cy=(e.clientY-rect.top)*scaleY;
  if(state===STATE.PLAYING&&cx>W-100&&cy<20)secretCheck();
  if(state===STATE.PLAYING&&cx<80&&cy<20)skinSecretCheck();
  if(state===STATE.MENU)startPlay();
});

function startPlay(){
  resetGame();state=STATE.LEVEL_TRANS;levelTimer=80;levelBoss=false;
}

// ===== GAME LOOP =====
function loop(){
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
